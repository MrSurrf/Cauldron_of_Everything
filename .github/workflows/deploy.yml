name: Build and Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR требует lowercase-имена образов (репозиторий содержит заглавные буквы)
      - name: Lowercase repository name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY@L}" >> "$GITHUB_ENV"

      - name: Set environment variables
        id: meta
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "vite_api_base_url=${{ vars.VITE_API_BASE_URL }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev" >> "$GITHUB_OUTPUT"
            echo "vite_api_base_url=${{ vars.VITE_API_BASE_URL_DEV }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=backend-${{ github.ref_name }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          provenance: false
          build-args: |
            VITE_API_BASE_URL=${{ steps.meta.outputs.vite_api_base_url }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=frontend-${{ github.ref_name }}

      - name: Trigger Dokploy backend deploy
        env:
          WEBHOOK: ${{ github.ref_name == 'main' && secrets.DOKPLOY_WEBHOOK_BACKEND || secrets.DOKPLOY_WEBHOOK_BACKEND_DEV }}
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "Pushed images for branch '$BRANCH':"
          echo "  Backend:  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ steps.meta.outputs.tag }}"
          echo "  Frontend: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ steps.meta.outputs.tag }}"
          echo ""

          if [ -z "$WEBHOOK" ]; then
            echo "⚠️  Backend webhook is not set for branch '$BRANCH'. Skipping backend redeploy."
            echo "    Add the webhook URL in GitHub Settings → Secrets and variables → Actions."
            exit 0
          fi

          echo "Triggering Dokploy backend deploy for branch '$BRANCH'..."
          HTTP_CODE=$(curl -sSL -o /tmp/dokploy_backend_response.txt -w "%{http_code}" -X POST "$WEBHOOK")
          echo "HTTP status: $HTTP_CODE"
          echo "Response:"
          cat /tmp/dokploy_backend_response.txt
          echo ""

          # Dokploy иногда возвращает 400 с телом {"message":"Application deployed successfully"},
          # поэтому шаг не падает при нестандартных HTTP-кодах.
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 500 ]; then
            echo "⚠️  Dokploy backend webhook returned $HTTP_CODE. Check the webhook URL."
          fi

      - name: Trigger Dokploy frontend deploy
        env:
          WEBHOOK: ${{ github.ref_name == 'main' && secrets.DOKPLOY_WEBHOOK_FRONTEND || secrets.DOKPLOY_WEBHOOK_FRONTEND_DEV }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "⚠️  Frontend webhook is not set for branch '$BRANCH'. Skipping frontend redeploy."
            echo "    Add the webhook URL in GitHub Settings → Secrets and variables → Actions."
            exit 0
          fi

          echo "Triggering Dokploy frontend deploy for branch '$BRANCH'..."
          HTTP_CODE=$(curl -sSL -o /tmp/dokploy_frontend_response.txt -w "%{http_code}" -X POST "$WEBHOOK")
          echo "HTTP status: $HTTP_CODE"
          echo "Response:"
          cat /tmp/dokploy_frontend_response.txt
          echo ""

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 500 ]; then
            echo "⚠️  Dokploy frontend webhook returned $HTTP_CODE. Check the webhook URL."
          fi
