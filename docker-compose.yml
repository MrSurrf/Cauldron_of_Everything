services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cauldron
      POSTGRES_USER: cauldron
      POSTGRES_PASSWORD: cauldron
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-change-me}
      DEBUG: ${DEBUG:-False}
      DATABASE_URL: ${DATABASE_URL:-postgres://cauldron:cauldron@db:5432/cauldron}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      SURVEY_CONFIG_DIR: /app/config
    volumes:
      # Локально монтируем config/ поверх запечённого в образ,
      # чтобы правки анкеты подхватывались без пересборки.
      - ./config:/app/config:ro
      - media:/app/backend/media
      - static:/app/backend/static
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  media:
  static:
